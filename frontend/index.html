<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ObsidianBrain</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Glass overrides using CSS variables (works for both light and dark themes) -->
    <style>
      /* ── Glass Input ── */
      .el-input__wrapper {
        border-radius: 12px !important;
        background: var(--bg-glass-subtle) !important;
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        box-shadow: 0 0 0 1px var(--border-glass) inset, var(--shadow-sm) !important;
        transition: all 0.25s ease !important;
      }
      .el-input__wrapper:hover {
        box-shadow: 0 0 0 1px var(--accent-border) inset, var(--shadow-sm) !important;
      }
      .el-input__wrapper.is-focus {
        box-shadow: 0 0 0 2px var(--accent-light), 0 0 0 1px var(--border-glass) inset !important;
      }
      .el-input__inner { color: var(--text-primary) !important; }
      .el-input__inner::placeholder { color: var(--text-faint) !important; }
      .el-input__icon, .el-range__icon, .el-range__close-icon { color: var(--text-muted) !important; }

      /* ── Glass Select ── */
      .el-select__wrapper {
        border-radius: 10px !important;
        background: var(--bg-glass-subtle) !important;
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        box-shadow: 0 0 0 1px var(--border-glass) inset !important;
      }
      .el-select__placeholder { color: var(--text-faint) !important; }
      .el-select__selected-item { color: var(--text-primary) !important; }

      /* ── Glass Date Picker ── */
      .el-date-editor.el-input__wrapper,
      .el-range-editor {
        border-radius: 12px !important;
        background: var(--bg-glass-subtle) !important;
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        border: 1px solid var(--border-glass) !important;
      }
      .el-range-input { color: var(--text-primary) !important; }
      .el-range-input::placeholder { color: var(--text-faint) !important; }
      .el-range-separator { color: var(--text-muted) !important; }

      /* ── Glass Dialog ── */
      .el-dialog {
        border-radius: 20px !important;
        background: var(--bg-glass-strong) !important;
        backdrop-filter: blur(calc(var(--glass-blur) + 20px)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 20px)) saturate(var(--glass-saturate)) !important;
        border: 1px solid var(--border-glass) !important;
        box-shadow: 0 12px 48px rgba(0,0,0,0.1), 0 4px 16px rgba(0,0,0,0.05), var(--inset-highlight) !important;
        overflow: hidden;
      }
      .el-dialog__header { border-radius: 20px 20px 0 0 !important; padding: 20px 24px 16px !important; }
      .el-dialog__body { padding: 16px 24px 24px !important; }
      .el-dialog__title { color: var(--text-primary) !important; }
      .el-dialog__headerbtn .el-dialog__close { color: var(--text-muted) !important; }
      .el-dialog__headerbtn:hover .el-dialog__close { color: var(--text-primary) !important; }
      .el-dialog__body { color: var(--text-secondary) !important; }

      /* ── Glass Card ── */
      .stat-card, .module-card, .status-card, .tool-card,
      .stat-chip, .result-card, .recent-card,
      .repo-card, .mode-option, .radar-card,
      .insight-card, .config-card,
      .combo-result, .question-result, .counterpoint-result,
      .concept-chip, .question-item, .counterpoint-item,
      .assessment {
        background: var(--bg-glass) !important;
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)) !important;
        border: 1px solid var(--border-glass) !important;
        box-shadow: var(--shadow-md), var(--inset-highlight) !important;
      }

      /* ── Glass Tag ── */
      .lang-tag, .tag {
        background: var(--bg-glass-subtle) !important;
        backdrop-filter: blur(var(--glass-blur)) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur)) !important;
        border: 1px solid var(--border-subtle) !important;
        color: var(--text-tertiary) !important;
      }

      /* ── el-button ── */
      .el-button {
        background: var(--bg-glass) !important;
        border: 1px solid var(--border-glass) !important;
        color: var(--text-secondary) !important;
      }
      .el-button:hover {
        background: var(--bg-hover) !important;
        border-color: var(--accent-border) !important;
        color: var(--text-primary) !important;
      }
      .el-button--primary {
        background: var(--accent) !important;
        border-color: var(--accent) !important;
        color: #fff !important;
      }

      /* ── el-tag ── */
      .el-tag {
        background: var(--bg-glass-subtle) !important;
        border: 1px solid var(--border-subtle) !important;
        color: var(--text-secondary) !important;
      }

      /* ── el-switch ── */
      .el-switch__core {
        background-color: var(--bg-glass-subtle) !important;
        border-color: var(--border-glass) !important;
      }
      .el-switch.is-checked .el-switch__core {
        background-color: var(--accent) !important;
        border-color: var(--accent) !important;
      }

      /* ── el-message ── */
      .el-message {
        background: var(--bg-glass-strong) !important;
        border: 1px solid var(--border-glass) !important;
        color: var(--text-primary) !important;
        backdrop-filter: blur(32px) saturate(200%) !important;
        -webkit-backdrop-filter: blur(32px) saturate(200%) !important;
      }

      /* ── el-descriptions ── */
      .el-descriptions__label {
        background: var(--bg-glass-subtle) !important;
        color: var(--text-muted) !important;
      }
      .el-descriptions__content {
        background: transparent !important;
        color: var(--text-secondary) !important;
      }
      .el-descriptions__cell {
        border-color: var(--border-faint) !important;
      }

      /* ── el-empty ── */
      .el-empty__description p { color: var(--text-muted) !important; }

      /* ── el-slider ── */
      .el-slider__runway { background-color: var(--bg-glass-subtle) !important; }
      .el-slider__bar { background-color: var(--accent) !important; }
      .el-slider__button { border-color: var(--accent) !important; background-color: var(--bg-base) !important; }

      /* ── el-overlay ── */
      .el-overlay { background-color: var(--el-mask-color, rgba(0,0,0,0.5)) !important; }

      /* ── el-popper (dropdowns) ── */
      .el-popper {
        background: var(--bg-glass-strong) !important;
        border: 1px solid var(--border-glass) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
      }
      .el-select-dropdown__item { color: var(--text-secondary) !important; }
      .el-select-dropdown__item.hover,
      .el-select-dropdown__item:hover { background: var(--bg-hover) !important; }
      .el-select-dropdown__item.selected { color: var(--accent) !important; }

      /* ── Glass Calendar Picker ── */
      .glass-picker {
        border-radius: 20px !important;
        border: 1px solid var(--border-glass) !important;
        background: var(--bg-glass-strong) !important;
        backdrop-filter: blur(calc(var(--glass-blur) + 20px)) saturate(var(--glass-saturate)) !important;
        -webkit-backdrop-filter: blur(calc(var(--glass-blur) + 20px)) saturate(var(--glass-saturate)) !important;
        box-shadow: 0 12px 48px rgba(0,0,0,0.1), 0 4px 16px rgba(0,0,0,0.05), var(--inset-highlight) !important;
        overflow: hidden;
      }
      .glass-picker .el-date-range-picker { background: transparent !important; }
      .glass-picker .el-date-range-picker__content { padding: 8px !important; }
      .glass-picker .el-date-range-picker__header,
      .glass-picker .el-date-picker__header { margin: 4px 8px !important; }
      .glass-picker .el-date-range-picker__header button,
      .glass-picker .el-date-picker__header button {
        border-radius: 8px !important; border: none !important;
        background: var(--bg-glass-subtle) !important; color: var(--text-secondary) !important;
        transition: background 0.2s ease !important;
      }
      .glass-picker .el-date-range-picker__header button:hover,
      .glass-picker .el-date-picker__header button:hover { background: var(--bg-hover) !important; }
      .glass-picker .el-date-table th {
        border-bottom: 1px solid var(--border-faint) !important;
        color: var(--text-muted) !important; font-size: 12px !important;
      }
      .glass-picker .el-date-table td .el-date-table-cell { border-radius: 10px !important; transition: all 0.2s ease !important; }
      .glass-picker .el-date-table td .el-date-table-cell:hover { background: var(--accent-light) !important; }
      .glass-picker .el-date-table td .el-date-table-cell__number { color: var(--text-secondary) !important; }
      .glass-picker .el-date-table td.current:not(.disabled) .el-date-table-cell__number,
      .glass-picker .el-date-table td.start-date .el-date-table-cell,
      .glass-picker .el-date-table td.end-date .el-date-table-cell {
        background: var(--accent) !important; border-radius: 10px !important; color: #fff !important;
      }
      .glass-picker .el-date-table td.in-range .el-date-table-cell { background: var(--accent-light) !important; }
      .glass-picker .el-date-table td.today .el-date-table-cell__number { color: var(--accent) !important; font-weight: 700 !important; }
      .glass-picker .el-picker-panel__footer {
        background: transparent !important; border-top: 1px solid var(--border-faint) !important;
      }
      .glass-picker .el-picker-panel__footer button {
        border-radius: 10px !important; background: var(--bg-glass-subtle) !important; color: var(--text-secondary) !important;
      }
      .glass-picker .el-popper__arrow { display: none !important; }
    </style>
  </body>
</html>
