[package]
name = "obsidian-brain"
version = "0.1.0"
edition = "2021"
description = "Local Rust knowledge engine with LLM Tool API for Obsidian"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
config = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
tantivy = "0.22"
jieba-rs = "0.7"
async-trait = "0.1"
futures = "0.3"

pulldown-cmark = "0.10"
gray_matter = "0.2"
git2 = "0.19"
sha2 = "0.10"
hex = "0.4"
# feed-rs = "1"
# tokio-cron-scheduler = "0.10"

jsonschema = "0.18"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
