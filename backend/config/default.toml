# =============================================================================
# ObsidianBrain 配置文件
# =============================================================================
# 仅保留服务启动配置，不再依赖 Obsidian 或 Local REST API 插件。
# 图片随数据库保存在同级 timeline/images，缓存上限在首页配置并立即生效。
# 通用 LLM 启动配置保存后重启；Book Wiki 模型供应商在 Wiki 配置页面管理。
# =============================================================================

[server]
# 监听地址（0.0.0.0 允许局域网访问，127.0.0.1 仅本地）
host = "0.0.0.0"
# 监听端口
port = 9876

[storage]
# 自动备份与手动备份最多保留的快照数量
backup_retention = 7
